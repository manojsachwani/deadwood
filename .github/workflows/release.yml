name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/deadwood-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/deadwood-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadwood-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/deadwood-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find dist -type f -name "deadwood-*" | sort
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -name "deadwood-*" -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/deadwood-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
