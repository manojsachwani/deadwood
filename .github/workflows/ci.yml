name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/deadwood

  # Runs the real binary on every platform a release is built for.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o "$RUNNER_TEMP/deadwood$(go env GOEXE)" ./cmd/deadwood
      - name: Non-interactive commands
        run: |
          bin="$RUNNER_TEMP/deadwood$(go env GOEXE)"
          "$bin" --version

          cd "$(mktemp -d)"
          git init -q -b main repo && cd repo
          git config user.name CI && git config user.email ci@example.com
          echo one > a.txt && git add a.txt && git commit -q -m "initial"
          git branch merged-one
          git switch -q -c unmerged
          echo two > b.txt && git add b.txt && git commit -q -m "work"
          git switch -q main

          list="$("$bin" --list)"; echo "$list"
          echo "$list" | grep -Eq "merged-one +merged"
          echo "$list" | grep -Eq "main +current"
          if echo "$list" | grep -Eq "unmerged +merged"; then echo "unmerged must not be merged"; exit 1; fi

          "$bin" --json | grep -q '"worktrees"'
          "$bin" clean | grep -q "merged-one"
          git show-ref --verify --quiet refs/heads/merged-one   # the dry run deletes nothing

          "$bin" clean --yes --json | tee clean.json
          grep -q '"deleted": true' clean.json
          if git show-ref --verify --quiet refs/heads/merged-one; then echo "merged-one should be gone"; exit 1; fi
          git show-ref --verify --quiet refs/heads/unmerged
          git show-ref --verify --quiet refs/heads/main
      - name: GitHub CLI signals
        # Needs a local branch whose tip has workflow runs, which a push to
        # master provides: this very run is in progress on it.
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/deadwood"
          # The fields deadwood asks for must exist in this version of gh.
          gh run list --limit 5 --json headSha,workflowName,status,conclusion > /dev/null
          gh pr list --state merged --limit 5 --json headRefName,headRefOid > /dev/null

          list="$("$bin" --list --ci --prs)"; echo "$list"
          echo "$list" | grep -Eq "master .*(running|pass|fail)"
